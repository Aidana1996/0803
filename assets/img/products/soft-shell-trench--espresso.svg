<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Soft Shell Trench in Espresso">
  <defs>
    <linearGradient id="bg-soft-shell-trench-espresso" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#eeebea"/><stop offset="1" stop-color="#dad5d3"/>
    </linearGradient>
    <radialGradient id="glow-soft-shell-trench-espresso" cx=".5" cy=".32" r=".62">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-soft-shell-trench-espresso" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#5d493c"/><stop offset=".55" stop-color="#4a3a30"/><stop offset="1" stop-color="#3b2e26"/>
    </linearGradient>
    <filter id="blur-soft-shell-trench-espresso" x="-20%" y="-20%" width="140%" height="140%">
