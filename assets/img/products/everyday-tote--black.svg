<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Everyday Tote in Black">
  <defs>
    <linearGradient id="bg-everyday-tote-black" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#ebebed"/><stop offset="1" stop-color="#d4d4d8"/>
    </linearGradient>
    <radialGradient id="glow-everyday-tote-black" cx=".5" cy=".32" r=".62">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-everyday-tote-black" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#24242b"/><stop offset=".55" stop-color="#16161a"/><stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <filter id="blur-everyday-tote-black" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="grain-everyday-tote-black" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="1250" fill="url(#bg-everyday-tote-black)"/>
  <ellipse cx="500" cy="400" rx="520" ry="440" fill="url(#glow-everyday-tote-black)"/>
  <g transform="translate(-192.1 -248.9) scale(1.3842)">
