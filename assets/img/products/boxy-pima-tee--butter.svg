<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Boxy Pima Tee in Butter">
  <defs>
    <linearGradient id="bg-boxy-pima-tee-butter" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#d4d0c4"/><stop offset="1" stop-color="#c1bbac"/>
    </linearGradient>
    <radialGradient id="glow-boxy-pima-tee-butter" cx=".5" cy=".32" r=".62">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-boxy-pima-tee-butter" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#eadbb3"/><stop offset=".55" stop-color="#e6d3a3"/><stop offset="1" stop-color="#dec687"/>
    </linearGradient>
    <filter id="blur-boxy-pima-tee-butter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="grain-boxy-pima-tee-butter" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="1250" fill="url(#bg-boxy-pima-tee-butter)"/>
  <ellipse cx="500" cy="400" rx="520" ry="440" fill="url(#glow-boxy-pima-tee-butter)"/>
  <g transform="translate(-260.0 -190.8) scale(1.5200)">
    <path d="M388 268 C420 258 452 288 500 288 C548 288 580 258 612 268 L716 316 C702 374 690 412 678 448 L632 430 C634 560 638 680 640 800 C546 824 454 824 360 800 C362 680 366 560 370 424 L338 436 C326 404 314 372 300 320 Z" fill="#2b2118" opacity=".13" transform="translate(18 22)" filter="url(#blur-boxy-pima-tee-butter)"/>
    <path d="M388 268 C420 258 452 288 500 288 C548 288 580 258 612 268 L716 316 C702 374 690 412 678 448 L632 430 C634 560 638 680 640 800 C546 824 454 824 360 800 C362 680 366 560 370 424 L338 436 C326 404 314 372 300 320 Z" fill="url(#g-boxy-pima-tee-butter)"/>
  </g>
  <rect width="1000" height="1250" filter="url(#grain-boxy-pima-tee-butter)" opacity=".9"/>
</svg>