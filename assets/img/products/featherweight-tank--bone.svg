<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Featherweight Tank in Bone">
  <defs>
    <linearGradient id="bg-featherweight-tank-bone" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#d1cec7"/><stop offset="1" stop-color="#bdb8af"/>
    </linearGradient>
    <radialGradient id="glow-featherweight-tank-bone" cx=".5" cy=".32" r=".62">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-featherweight-tank-bone" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#ebe7df"/><stop offset=".55" stop-color="#e3ddd2"/><stop offset="1" stop-color="#d5ccbc"/>
    </linearGradient>
    <filter id="blur-featherweight-tank-bone" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="grain-featherweight-tank-bone" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="1250" fill="url(#bg-featherweight-tank-bone)"/>
  <ellipse cx="500" cy="400" rx="520" ry="440" fill="url(#glow-featherweight-tank-bone)"/>
  <g transform="translate(-260.0 -169.5) scale(1.5200)">
    <path d="M396 260 C428 268 466 292 500 292 C534 292 572 268 604 260 C602 330 618 356 632 392 C640 500 644 660 646 772 C552 794 448 794 354 772 C356 660 360 500 368 392 C382 356 398 330 396 260 Z" fill="#2b2118" opacity=".13" transform="translate(18 22)" filter="url(#blur-featherweight-tank-bone)"/>
    <path d="M396 260 C428 268 466 292 500 292 C534 292 572 268 604 260 C602 330 618 356 632 392 C640 500 644 660 646 772 C552 794 448 794 354 772 C356 660 360 500 368 392 C382 356 398 330 396 260 Z" fill="url(#g-featherweight-tank-bone)"/>
  </g>
  <rect width="1000" height="1250" filter="url(#grain-featherweight-tank-bone)" opacity=".9"/>
