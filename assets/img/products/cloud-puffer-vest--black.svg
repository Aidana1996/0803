<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Cloud Puffer Vest in Black">
  <defs>
    <linearGradient id="bg-cloud-puffer-vest-black" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#ebebed"/><stop offset="1" stop-color="#d4d4d8"/>
    </linearGradient>
    <radialGradient id="glow-cloud-puffer-vest-black" cx=".5" cy=".32" r=".62">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-cloud-puffer-vest-black" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#24242b"/><stop offset=".55" stop-color="#16161a"/><stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <filter id="blur-cloud-puffer-vest-black" x="-20%" y="-20%" width="140%" height="140%">
