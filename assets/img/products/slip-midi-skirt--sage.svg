<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Slip Midi Skirt in Sage">
  <defs>
    <linearGradient id="bg-slip-midi-skirt-sage" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#ecedeb"/><stop offset="1" stop-color="#d7d8d4"/>
    </linearGradient>
    <radialGradient id="glow-slip-midi-skirt-sage" cx=".5" cy=".32" r=".62">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
