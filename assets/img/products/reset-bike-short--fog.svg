<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Reset Bike Short in Fog">
  <defs>
    <linearGradient id="bg-reset-bike-short-fog" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#cfcdc9"/><stop offset="1" stop-color="#bab8b3"/>
    </linearGradient>
    <radialGradient id="glow-reset-bike-short-fog" cx=".5" cy=".32" r=".62">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-reset-bike-short-fog" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#c2c0b9"/><stop offset=".55" stop-color="#b9b6ae"/><stop offset="1" stop-color="#a8a59b"/>
    </linearGradient>
    <filter id="blur-reset-bike-short-fog" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="grain-reset-bike-short-fog" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="1250" fill="url(#bg-reset-bike-short-fog)"/>
  <ellipse cx="500" cy="400" rx="520" ry="440" fill="url(#glow-reset-bike-short-fog)"/>
  <g transform="translate(-260.0 -78.3) scale(1.5200)">
    <path d="M382 232 C372 300 360 350 358 400 C357 470 366 560 372 700 L476 700 C484 640 492 600 500 578 C508 600 516 640 524 700 L628 700 C634 560 643 470 642 400 C640 350 628 300 618 232 Z" fill="#2b2118" opacity=".13" transform="translate(18 22)" filter="url(#blur-reset-bike-short-fog)"/>
    <path d="M382 232 C372 300 360 350 358 400 C357 470 366 560 372 700 L476 700 C484 640 492 600 500 578 C508 600 516 640 524 700 L628 700 C634 560 643 470 642 400 C640 350 628 300 618 232 Z" fill="url(#g-reset-bike-short-fog)"/><path d="M358 316 C440 300 560 300 642 316" fill="none" stroke="#938f82" stroke-width="3" stroke-linecap="round" opacity=".5"/>
  </g>
  <rect width="1000" height="1250" filter="url(#grain-reset-bike-short-fog)" opacity=".9"/>
</svg>