<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Cropped Cardigan in Butter">
  <defs>
    <linearGradient id="bg-cropped-cardigan-butter" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#d4d0c4"/><stop offset="1" stop-color="#c1bbac"/>
    </linearGradient>
    <radialGradient id="glow-cropped-cardigan-butter" cx=".5" cy=".32" r=".62">
