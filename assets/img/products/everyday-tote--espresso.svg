<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Everyday Tote in Espresso">
  <defs>
    <linearGradient id="bg-everyday-tote-espresso" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#eeebea"/><stop offset="1" stop-color="#dad5d3"/>
    </linearGradient>
    <radialGradient id="glow-everyday-tote-espresso" cx=".5" cy=".32" r=".62">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-everyday-tote-espresso" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#5d493c"/><stop offset=".55" stop-color="#4a3a30"/><stop offset="1" stop-color="#3b2e26"/>
    </linearGradient>
    <filter id="blur-everyday-tote-espresso" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="grain-everyday-tote-espresso" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1000" height="1250" fill="url(#bg-everyday-tote-espresso)"/>
  <ellipse cx="500" cy="400" rx="520" ry="440" fill="url(#glow-everyday-tote-espresso)"/>
  <g transform="translate(-192.1 -248.9) scale(1.3842)">
    <path d="M316 462 L684 462 L708 934 C709 958 692 976 668 976 L332 976 C308 976 291 958 292 934 Z" fill="#2b2118" opacity=".13" transform="translate(18 22)" filter="url(#blur-everyday-tote-espresso)"/>
    <path d="M316 462 L684 462 L708 934 C709 958 692 976 668 976 L332 976 C308 976 291 958 292 934 Z" fill="url(#g-everyday-tote-espresso)"/><path d="M396 466 C396 356 442 306 500 306 C558 306 604 356 604 466" fill="none" stroke="url(#g-everyday-tote-espresso)" stroke-width="22" stroke-linecap="round"/><path d="M292 560 L708 560" fill="none" stroke="#755c4c" stroke-width="3" stroke-linecap="round" opacity=".5"/>
  </g>
  <rect width="1000" height="1250" filter="url(#grain-everyday-tote-espresso)" opacity=".9"/>
</svg>