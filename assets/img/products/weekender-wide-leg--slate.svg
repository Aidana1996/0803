<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Weekender Wide-Leg in Slate">
  <defs>
    <linearGradient id="bg-weekender-wide-leg-slate" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#ebeced"/><stop offset="1" stop-color="#d4d6d8"/>
    </linearGradient>
    <radialGradient id="glow-weekender-wide-leg-slate" cx=".5" cy=".32" r=".62">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-weekender-wide-leg-slate" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#6a7079"/><stop offset=".55" stop-color="#5c6169"/><stop offset="1" stop-color="#50545b"/>
    </linearGradient>
    <filter id="blur-weekender-wide-leg-slate" x="-20%" y="-20%" width="140%" height="140%">
