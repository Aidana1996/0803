<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Ambient Half-Zip in Black">
  <defs>
    <linearGradient id="bg-ambient-half-zip-black" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#ebebed"/><stop offset="1" stop-color="#d4d4d8"/>
    </linearGradient>
    <radialGradient id="glow-ambient-half-zip-black" cx=".5" cy=".32" r=".62">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-ambient-half-zip-black" x1=".15" y1="0" x2=".85" y2="1">
