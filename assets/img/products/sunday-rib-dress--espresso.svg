<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-label="Sunday Rib Dress in Espresso">
  <defs>
    <linearGradient id="bg-sunday-rib-dress-espresso" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#eeebea"/><stop offset="1" stop-color="#dad5d3"/>
    </linearGradient>
    <radialGradient id="glow-sunday-rib-dress-espresso" cx=".5" cy=".32" r=".62">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-sunday-rib-dress-espresso" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#5d493c"/><stop offset=".55" stop-color="#4a3a30"/><stop offset="1" stop-color="#3b2e26"/>
    </linearGradient>
    <filter id="blur-sunday-rib-dress-espresso" x="-20%" y="-20%" width="140%" height="140%">
