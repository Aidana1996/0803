    <text x="672" y="120" transform="rotate(90 672 120)">PULLMAN ST</text>
    <text x="80" y="232">ALTON AVE</text>
    <text x="80" y="452">MACARTHUR BLVD</text>
    <text x="120" y="646" transform="rotate(-12 120 646)">CA-55</text>
