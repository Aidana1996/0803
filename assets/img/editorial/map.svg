      <stop offset="0" stop-color="#f2ede4"/><stop offset="1" stop-color="#e7e0d3"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="700" fill="url(#land)"/>
  <!-- blocks -->
  <g fill="#e0d8c9">
    <rect x="60" y="70" width="230" height="150" rx="4"/>
    <rect x="60" y="260" width="230" height="180" rx="4"/>
    <rect x="60" y="480" width="230" height="150" rx="4"/>
    <rect x="360" y="70" width="260" height="150" rx="4"/>
    <rect x="360" y="480" width="260" height="150" rx="4"/>
    <rect x="700" y="70" width="240" height="180" rx="4"/>
    <rect x="700" y="300" width="240" height="140" rx="4"/>
    <rect x="700" y="490" width="240" height="140" rx="4"/>
  </g>
  <!-- freeway 55 -->
  <path d="M0 640 C 220 610 300 520 340 380 C 380 240 420 120 520 0" stroke="#d3c6ae" stroke-width="46" fill="none"/>
  <path d="M0 640 C 220 610 300 520 340 380 C 380 240 420 120 520 0" stroke="#c8b99e" stroke-width="2" fill="none" stroke-dasharray="14 12"/>
